name: NeverSkip Sync

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Browser sync → Neon
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore NeverSkip Playwright profile
        env:
          NEVERSKIP_PROFILE_B64_1: ${{ secrets.NEVERSKIP_PROFILE_B64_1 }}
          NEVERSKIP_PROFILE_B64_2: ${{ secrets.NEVERSKIP_PROFILE_B64_2 }}
        run: |
          set -euo pipefail
          # Do not enable xtrace — never dump the secret to logs.
          set +x

          if [ -z "${NEVERSKIP_PROFILE_B64_1:-}" ]; then
            echo "PROFILE_PART1_PRESENT=false"
            echo "ERROR: NEVERSKIP_PROFILE_B64_1 secret is missing or empty."
            echo "Add repository secret NEVERSKIP_PROFILE_B64_1 from .neverskip-profile.b64.part1"
            exit 1
          fi
          echo "PROFILE_PART1_PRESENT=true"

          if [ -z "${NEVERSKIP_PROFILE_B64_2:-}" ]; then
            echo "PROFILE_PART2_PRESENT=false"
            echo "ERROR: NEVERSKIP_PROFILE_B64_2 secret is missing or empty."
            echo "Add repository secret NEVERSKIP_PROFILE_B64_2 from .neverskip-profile.b64.part2"
            exit 1
          fi
          echo "PROFILE_PART2_PRESENT=true"

          PROFILE_DIR="${RUNNER_TEMP}/neverskip-profile"
          B64_FILE="${RUNNER_TEMP}/neverskip-profile.b64"
          TGZ_FILE="${RUNNER_TEMP}/neverskip-profile.tgz"

          mkdir -p "$PROFILE_DIR"
          # GitHub secret UI often appends trailing newlines (and paste can add
          # whitespace). Strip CR/LF/space/tab from each part before concat so
          # part1+part2 matches the packaged unwrapped Base64 byte sequence.
          # Never echo secret values.
          PART1_CLEAN="$(printf '%s' "${NEVERSKIP_PROFILE_B64_1}" | tr -d '\r\n\t ')"
          PART2_CLEAN="$(printf '%s' "${NEVERSKIP_PROFILE_B64_2}" | tr -d '\r\n\t ')"
          printf '%s' "${PART1_CLEAN}${PART2_CLEAN}" > "$B64_FILE"
          unset PART1_CLEAN PART2_CLEAN
          B64_SIZE="$(wc -c < "$B64_FILE" | tr -d ' ')"
          echo "PROFILE_ARCHIVE_B64_SIZE=${B64_SIZE}"

          # Prefer ignore-garbage when available (GNU coreutils on ubuntu-latest).
          if ! base64 --help 2>&1 | grep -q -- '--ignore-garbage'; then
            DECODE_CMD=(base64 -d)
          else
            DECODE_CMD=(base64 -d --ignore-garbage)
          fi
          if ! "${DECODE_CMD[@]}" < "$B64_FILE" > "$TGZ_FILE" 2>/dev/null; then
            echo "PROFILE_ARCHIVE_VALID=false"
            echo "ERROR: Reconstructed NEVERSKIP_PROFILE_B64 parts are not valid base64."
            rm -f "$B64_FILE" "$TGZ_FILE"
            exit 1
          fi
          TGZ_SIZE="$(wc -c < "$TGZ_FILE" | tr -d ' ')"
          echo "PROFILE_ARCHIVE_SIZE=${TGZ_SIZE}"

          if [ "$TGZ_SIZE" -lt 100 ]; then
            echo "PROFILE_ARCHIVE_VALID=false"
            echo "ERROR: Decoded profile archive is too small to be valid."
            rm -f "$B64_FILE" "$TGZ_FILE"
            exit 1
          fi

          if ! tar -tzf "$TGZ_FILE" >/dev/null 2>&1; then
            echo "PROFILE_ARCHIVE_VALID=false"
            echo "ERROR: Decoded archive is not a valid gzip tar."
            rm -f "$B64_FILE" "$TGZ_FILE"
            exit 1
          fi
          echo "PROFILE_ARCHIVE_VALID=true"

          tar -xzf "$TGZ_FILE" -C "$PROFILE_DIR"
          echo "PROFILE_EXTRACTION_SUCCESSFUL=true"

          # Drop encoded copies as soon as extract succeeds
          rm -f "$B64_FILE" "$TGZ_FILE"

          PROFILE_FILES="$(find "$PROFILE_DIR" -type f | wc -l | tr -d ' ')"
          echo "PROFILE_FILES=${PROFILE_FILES}"

          if [ "$PROFILE_FILES" -eq 0 ]; then
            echo "PROFILE_DIR_EXISTS=true"
            echo "ERROR: Restored NeverSkip profile directory is empty."
            exit 1
          fi

          # Reject accidental nesting (.playwright-profile wrapper inside PROFILE_DIR)
          if [ -d "$PROFILE_DIR/.playwright-profile" ] && [ ! -d "$PROFILE_DIR/Default" ]; then
            echo "ERROR: Extracted profile appears nested under .playwright-profile/."
            echo "Repackage with ./scripts/package-neverskip-profile.sh (minimal export layout)."
            exit 1
          fi

          if [ ! -d "$PROFILE_DIR/Default" ] && [ ! -f "$PROFILE_DIR/Local State" ]; then
            echo "ERROR: Extracted profile missing expected Chromium layout (Default/ or Local State)."
            exit 1
          fi

          echo "PROFILE_DIR_EXISTS=true"
          echo "NeverSkip profile restored to runner temp directory."
          echo "PROFILE_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
      - name: Sync NeverSkip → PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEVERSKIP_PROFILE_DIR: ${{ env.PROFILE_DIR }}
          NEVERSKIP_HEADLESS: "true"
        run: |
          set -euo pipefail
          set +x

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL_PRESENT=false"
            echo "ERROR: DATABASE_URL secret is missing or empty."
            exit 1
          fi
          echo "DATABASE_URL_PRESENT=true"

          if [ -z "${NEVERSKIP_PROFILE_DIR:-}" ] || [ ! -d "$NEVERSKIP_PROFILE_DIR" ]; then
            echo "PROFILE_DIR_EXISTS=false"
            echo "ERROR: NEVERSKIP_PROFILE_DIR is not set or missing."
            exit 1
          fi
          echo "PROFILE_DIR_EXISTS=true"
          echo "Using NeverSkip profile directory: runner-temp/neverskip-profile"

          # Existing script exits 1 on session expiry / Access Denied /
          # incomplete pagination / DB sync errors.
          set +e
          npm run sync:neverskip:browser
          SYNC_EXIT=$?
          set -e

          if [ "$SYNC_EXIT" -ne 0 ]; then
            echo "NEVERSKIP_SYNC_FAILED=true"
            echo "NEVERSKIP_SESSION_INVALID_OR_BLOCKED=possible"
            echo "If logs show path=/auth/login or NeverSkip session expired:"
            echo "  The restored Chromium profile is not authenticated on this GitHub-hosted Linux runner."
            echo "  Mac-created Playwright profiles are not reliably portable here (cookie encryption / IP / bot checks)."
            echo "  Do NOT bypass CAPTCHA or Incapsula."
            echo "  Use a persistent Linux worker (deploy/neverskip-worker) and create the profile on that same host."
            exit "$SYNC_EXIT"
          fi
      - name: Cleanup NeverSkip profile
        if: always()
        run: |
          set +x
          rm -rf "${RUNNER_TEMP}/neverskip-profile" \
                 "${RUNNER_TEMP}/neverskip-profile.b64" \
                 "${RUNNER_TEMP}/neverskip-profile.tgz" || true
          echo "Temporary NeverSkip profile cleaned up."
